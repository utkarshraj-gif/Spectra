services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ../frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/spectra?sslmode=disable
      - WORKER_SERVICE_URL=http://meeting-worker:5001
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - db
      - meeting-worker

  # Meeting Worker (Playwright Headless Chromium)
  meeting-worker:
    build:
      context: ../meeting-worker
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    shm_size: '2gb' # Required for Chromium WebRTC stability
    environment:
      - PORT=5001
      - RECORDINGS_PATH=/app/recordings
    volumes:
      - ../recordings:/app/recordings

  # Python AI Service (Managed with uv - Phase 3)
  # ai-service:
  #   build:
  #     context: ../ai-service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - PORT=8000
  #   depends_on:
  #     - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spectra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
